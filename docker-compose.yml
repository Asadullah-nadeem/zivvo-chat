version: '3.8'

services:
  zivvochat-db:
    image: postgres:16-alpine
    container_name: zivvochat-db
    restart: always
    environment:
      POSTGRES_USER: zivvo
      POSTGRES_PASSWORD: zivvopass
      POSTGRES_DB: zivvochat_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zivvo -d zivvochat_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zivvochat-network

  zivvochat-server:
    image: zivvochat/server:latest
    build:
      context: .
      target: server-runtime
    ports:
      - "5000:5000"
    depends_on:
      zivvochat-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://zivvo:zivvopass@zivvochat-db:5432/zivvochat_db
    networks:
      - zivvochat-network

  zivvochat-frontend:
    image: zivvochat/frontend:latest
    build:
      context: .
      target: frontend-runtime
    ports:
      - "3000:3000"
    depends_on:
      - zivvochat-server
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    networks:
      - zivvochat-network

networks:
  zivvochat-network:
    driver: bridge

volumes:
  pgdata: